name: Prüfungen jährlich wiederholen

on:
  schedule:
    - cron: "0 5 1 2 *"     # jedes Jahr am 1. Februar, 05:00 UTC (die Dezember-Fenster des Vorjahres sind dann abgeschlossen)
  workflow_dispatch:         # auf Wunsch auch von Hand ("Run workflow")
    inputs:
      speichern:
        description: "Ergebnisse ins Repository speichern (zum Ausprobieren auf false stellen)"
        type: boolean
        default: true

permissions:
  contents: write            # Ergebnisse und Archiv ins Repository speichern
  actions: write             # danach die Seite neu bauen lassen

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  pruefungen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bibliotheken installieren
        run: pip install -r requirements.txt

      - name: Prüfungen mit unveränderten Regeln neu rechnen
        run: python pruefungen_jaehrlich.py

      - name: Ergebnisse ins Repository speichern
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.speichern }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/pruefung*.json daten/pruefungen_verlauf.csv daten/pruefungen_archiv
          if ! git diff --cached --quiet; then
            git commit -m "Jährliche Prüfungen $(date -u +%F)"
            git push
          fi

      - name: Seite neu bauen lassen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.speichern }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml
